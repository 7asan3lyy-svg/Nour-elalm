<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل شعبة الثانوية العامة - مدرسة نور العلم</title>
    <style>
        :root {
            --primary: #1e3c72;
            --secondary: #2a5298;
            --accent: #ffb300;
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 6px 10px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 5px;
            font-size: 1.4rem;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .author {
            text-align: center;
            font-size: 0.8rem;
            color: var(--accent);
            background: #333;
            padding: 4px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--primary);
        }

        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--secondary);
            outline: none;
            background: #fff;
            box-shadow: 0 0 5px rgba(42, 82, 152, 0.3);
        }

        /* تصميم الأزرار بنمط 3D بارز وجذاب */
        button {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 5px 0 #008ba3, 0 8px 15px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
            margin-top: 10px;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #008ba3, 0 3px 6px rgba(0,0,0,0.2);
        }

        .btn-admin {
            background: linear-gradient(to bottom, #f7971e 0%, #ffd200 100%);
            box-shadow: 0 5px 0 #c77400, 0 8px 15px rgba(0,0,0,0.2);
        }
        .btn-admin:active {
            box-shadow: 0 1px 0 #c77400, 0 3px 6px rgba(0,0,0,0.2);
        }

        .btn-logout {
            background: linear-gradient(to bottom, #ff5e62 0%, #ff9966 100%);
            box-shadow: 0 5px 0 #b33639, 0 8px 15px rgba(0,0,0,0.2);
        }
        .btn-logout:active {
            box-shadow: 0 1px 0 #b33639, 0 3px 6px rgba(0,0,0,0.2);
        }

        .info-box {
            background: #eef2f7;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            border-right: 4px solid var(--secondary);
        }

        .hidden { display: none; }
        .error { color: #e74c3c; font-size: 0.85rem; margin-top: 5px; text-align: center; font-weight: bold; }
        .success { color: #27ae60; text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>اختيار الشعب وتخصصاتها</h2>
    <div class="subtitle">مدرسة نور العلم الثانوية المشتركة</div>
    <div class="author">تصميم مسيو حسن علي</div>

    <!-- خطوة تسجيل الدخول (بالرقم القومي للطالب أو كود المدير admin123) -->
    <div id="loginSection">
        <div class="form-group">
            <label for="nationalIdInput">أدخل الرقم القومي:</label>
            <input type="text" id="nationalIdInput" placeholder="أدخل الرقم القومي المكون من 14 رقماً">
        </div>
        <button onclick="checkLogin()">دخول</button>
        <div id="loginError" class="error"></div>
    </div>

    <!-- واجهة الطالب لاختيار الشعبة والمادة -->
    <div id="formSection" class="hidden">
        <div class="info-box" id="studentInfo"></div>

        <div class="form-group">
            <label for="divisionSelect">اختر الشعبة:</label>
            <select id="divisionSelect" onchange="updateSpecialties()">
                <option value="">-- اختر الشعبة --</option>
                <option value="الطب وعلوم الحياة">الطب وعلوم الحياة</option>
                <option value="الهندسة وعلوم الحاسب">الهندسة وعلوم الحاسب</option>
                <option value="الأعمال">الأعمال</option>
                <option value="الآداب والفنون">الآداب والفنون</option>
            </select>
        </div>

        <div class="form-group">
            <label for="specialtySelect">اختر مادة التخصص:</label>
            <select id="specialtySelect">
                <option value="">-- اختر الشعبة أولاً --</option>
            </select>
        </div>

        <button onclick="saveStudentData()">تأكيد وحفظ الاختيار</button>
        <div id="successMsg" class="success"></div>
    </div>

    <!-- لوحة تحكم مدير المدرسة (تفتح عند إدخال admin123 في خانة الرقم القومي) -->
    <div id="adminSection" class="hidden">
        <div class="info-box" style="background: #fff8e1; border-right-color: #f7971e; text-align: center; font-weight: bold;">
            لوحة تحكم مدير المدرسة
        </div>
        <button class="btn-admin" onclick="downloadExcel()">تحميل كشف الإكسيل للطلاب</button>
        <button class="btn-logout" onclick="location.reload()">تسجيل خروج</button>
    </div>
</div>

<script>
    let studentsData = [];
    let currentStudent = null;
    const ADMIN_CODE = "admin123"; // كود المدير السري في خانة الرقم القومي

    // ربط كل شعبة بمادتين التخصص المحددة بدقة
    const specialtiesMap = {
        "الطب وعلوم الحياة": ["الرياضيات", "الفيزياء"],
        "الهندسة وعلوم الحاسب": ["الكيمياء", "البرمجة"],
        "الأعمال": ["المحاسبة", "إدارة الأعمال"],
        "الآداب والفنون": ["علم النفس", "اللغة الفرنسية"]
    };

    // تحميل ملف البيانات الخارجي JSON عند فتح الصفحة
    window.onload = function() {
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const savedLocal = localStorage.getItem('noor_elalm_students');
                studentsData = savedLocal ? JSON.parse(savedLocal) : data;
            })
            .catch(err => console.error('خطأ في تحميل ملف البيانات:', err));
    };

    function checkLogin() {
        const inputVal = document.getElementById('nationalIdInput').value.trim();
        const errorDiv = document.getElementById('loginError');
        
        // التحقق من كود المدير السري
        if (inputVal === ADMIN_CODE) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('adminSection').classList.remove('hidden');
            return;
        }

        // البحث عن الطالب باستخدام الرقم القومي
        currentStudent = studentsData.find(s => s.nationalId === inputVal);

        if (currentStudent) {
            errorDiv.textContent = "";
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('formSection').classList.remove('hidden');

            // عرض بيانات الطالب في المربع التعريفي
            document.getElementById('studentInfo').innerHTML = `
                <div><strong>اسم الطالب:</strong> ${currentStudent.name}</div>
                <div><strong>رقم الجلوس:</strong> ${currentStudent.seatNo}</div>
                <div><strong>الرقم القومي:</strong> ${currentStudent.nationalId}</div>
                <div><strong>الحالة:</strong> ${currentStudent.status}</div>
            `;

            // استرجاع الاختيارات القديمة إن وجدت
            if (currentStudent.division) {
                document.getElementById('divisionSelect').value = currentStudent.division;
                updateSpecialties();
                document.getElementById('specialtySelect').value = currentStudent.specialty;
            }
        } else {
            errorDiv.textContent = "الرقم القومي غير صحيح أو غير مسجل بالنظام!";
        }
    }

    // تحديث القائمة المنسدلة الثانية ديناميكياً بناءً على الشعبة المختارة
    function updateSpecialties() {
        const division = document.getElementById('divisionSelect').value;
        const specialtySelect = document.getElementById('specialtySelect');
        
        specialtySelect.innerHTML = '<option value="">-- اختر مادة التخصص --</option>';
        
        if (specialtiesMap[division]) {
            specialtiesMap[division].forEach(spec => {
                const opt = document.createElement('option');
                opt.value = spec;
                opt.textContent = spec;
                specialtySelect.appendChild(opt);
            });
        }
    }

    // حفظ اختيار الطالب في الـ LocalStorage
    function saveStudentData() {
        const division = document.getElementById('divisionSelect').value;
        const specialty = document.getElementById('specialtySelect').value;

        if (!division || !specialty) {
            alert('يرجى اختيار الشعبة ومادة التخصص أولاً!');
            return;
        }

        currentStudent.division = division;
        currentStudent.specialty = specialty;

        localStorage.setItem('noor_elalm_students', JSON.stringify(studentsData));

        document.getElementById('successMsg').textContent = "تم حفظ اختياراتك بنجاح!";
        setTimeout(() => {
            location.reload();
        }, 2000);
    }

    // دالة تنزيل ملف الإكسيل (CSV) لمدير المدرسة
    function downloadExcel() {
        let csvContent = "\uFEFFرقم الجلوس,الرقم القومي,اسم الطالب,الحالة,الشعبة,مادة التخصص\n";
        
        studentsData.forEach(s => {
            csvContent += `"${s.seatNo}","${s.nationalId}","${s.name}","${s.status}","${s.division || ''}","${s.specialty || ''}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'noor_elalm_choices.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
